<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bonsai</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hud">
  <div class="panel" id="info">
    <button id="speciesBtn" title="Ver ficha da espécie"></button><span id="date"></span>
    <span id="measures" title="Altura do solo até a ponta mais alta · diâmetro do tronco logo acima das raízes"></span>
    <span id="branches" hidden></span>
  </div>
  <div class="panel" id="speeds">
    <button id="undo" title="Desfazer (Ctrl+Z)" disabled>↶ Desfazer</button>
    <button data-speed="0" title="Pausar">⏸</button>
    <button data-speed="1" title="1 dia por segundo">1×</button>
    <button data-speed="7" title="1 semana por segundo">7×</button>
    <button data-speed="30" title="1 mês por segundo">30×</button>
    <button data-speed="90" title="1 estação a cada segundo">90×</button>
    <button id="reset" title="Nova planta, salvar ou abrir arquivo de planta">Planta ▾</button>
  </div>
</div>
<div class="panel" id="newMenu" hidden>
  <label class="name">Nome da planta<input id="plantName" maxlength="40" spellcheck="false"></label>
  <button id="saveFile">💾 Salvar em arquivo<small>Baixa um arquivo .bonsai.json desta planta</small></button>
  <button id="openFile">📂 Abrir arquivo<small>Carrega uma planta salva (a atual fica no Desfazer)</small></button>
  <input type="file" id="fileInput" accept=".json,application/json" hidden>
  <hr>
  <label class="name" id="speciesPick" hidden>Espécie da planta nova<select id="speciesSelect"></select></label>
  <button data-origin="seed">🌰 Nova: semente<small>Plante e acompanhe a germinação</small></button>
  <button data-origin="muda">🌱 Nova: muda de 1 ano<small>Já com tronco e alguns galhos</small></button>
</div>
<div class="panel" id="views">
  <canvas id="viewCube" title="Clique numa face para ver daquele lado · arraste para girar"></canvas>
  <div class="row">
    <button class="icon" data-view="home" title="Vista padrão: a frente do bonsai (tecla H)">⌂</button>
    <button class="icon" id="setFront" title="Definir frente: gire a planta até o lado que quer como frente e clique">🎯</button>
    <button class="icon" id="qualityBtn">✨</button>
    <button class="icon" id="leafToggle" title="Ocultar folhas (tecla F)">🍃</button>
  </div>
  <div class="row tools">
    <button class="icon on" id="toolPrune" title="Ferramenta de poda (tecla P)">✂️</button>
    <button class="icon" id="toolBranch" title="Remover galho inteiro com corte rente, num clique (tecla R)">🪚</button>
    <button class="icon" id="toolWire" title="Ferramenta de arame: dobrar galhos (tecla A)">🪢</button>
  </div>
</div>
<div class="panel" id="speciesCard" hidden></div>
<div class="panel" id="deathCard" hidden>
  <h2>🥀 A planta morreu</h2>
  <p id="deathText"></p>
  <div class="row">
    <button id="deathOpen">📂 Abrir arquivo</button>
    <button id="deathSeed">🌰 Nova semente</button>
    <button id="deathMuda">🌱 Nova muda</button>
  </div>
  <button id="deathClose" class="link">Só olhar</button>
</div>
<div class="panel" id="care">
  <div id="potName"></div>
  <div class="meter"><span>🪴 Raízes</span><div class="bar"><i id="mRoots"></i></div><em id="tRoots"></em></div>
  <div class="meter"><span>☀️ Luz</span><div class="bar"><i id="mLight"></i></div><em id="tLight"></em></div>
  <div class="meter"><span>💧 Terra</span><div class="bar"><i id="mWater"></i></div><em id="tWater"></em></div>
  <div class="meter"><span>🌫️ Ar</span><div class="bar"><i id="mHumidity"></i></div><em id="tHumidity"></em></div>
  <div class="meter"><span>🌿 Vigor</span><div class="bar"><i id="mVigor"></i></div><em id="tVigor"></em></div>
  <div class="row">
    <button id="btnWater" title="Molha a terra do vaso">💧 Regar</button>
    <button id="btnMist" title="Aumenta a umidade do ar em volta das folhas">🌫️ Borrifar</button>
  </div>
  <div class="row">
    <button id="btnPot" title="Trocar de vaso ou plantar no solo">🪴 Transplantar</button>
    <button id="btnRoots" title="Podar as raízes e voltar ao mesmo vaso">✂️ Raízes</button>
  </div>
  <div class="row">
    <button id="btnSpot" title="Mudar a planta de lugar (quantidade de luz)">☀️ Lugar</button>
    <button id="btnDefol" title="Tirar folhas para que as novas venham menores">🍂 Desfolhar</button>
  </div>
  <label><input type="checkbox" id="autoWater"> Rega automática</label>
</div>
<div class="panel" id="potMenu" hidden></div>
<div id="hint"></div>
<div id="toast"></div>
<div id="tip" hidden></div>
<div class="panel" id="wirePanel" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
